{% extends "base.html" %}
{% block title %}新建批次 - 铭深文件生成系统{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>新建批次</h1>
  <form method="post">
    <label for="name">批次名称（可选）</label>
    <input id="name" name="name" maxlength="120" placeholder="留空时使用自动批次编号">
    <div class="actions">
      <button class="button" type="submit">创建批次</button>
      <a class="button secondary" href="{{ url_for('batch_list') }}">返回</a>
    </div>
  </form>
</div>
{% endblock %}
